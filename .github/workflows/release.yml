name: release

# Pushing a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`) builds and tests
# arqsim on Linux, macOS and Windows and publishes the binaries as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.1.0"
        required: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          bin="build/arqsim$ext"; [ -f "$bin" ] || bin="build/Release/arqsim$ext"
          pkg="arqsim-$TAG-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          cp "$bin" README.md "dist/$pkg/"
          "dist/$pkg/arqsim$ext" version
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then 7z a -tzip "$pkg.zip" "$pkg" >/dev/null
          else tar -czf "$pkg.tar.gz" "$pkg"; fi
          rm -rf "$pkg"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    name: publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "arqsim $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
